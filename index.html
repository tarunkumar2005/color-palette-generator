<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Paletter Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Color Palette Generator</h1>
    <button id="generate-btn">
      Generate Palette
    </button>

    <div class="palette-container">
      <div class="color-box">
        <div class="color"></div>
        <div class="color-info">
          <span class="hex-value">#E256B4</span>
        </div>
      </div>

      <div class="color-box">
        <div class="color"></div>
        <div class="color-info">
          <span class="hex-value">#A7B36C</span>
        </div>
      </div>

      <div class="color-box">
        <div class="color"></div>
        <div class="color-info">
          <span class="hex-value">#23D2EF</span>
        </div>
      </div>

      <div class="color-box">
        <div class="color"></div>
        <div class="color-info">
          <span class="hex-value">#89A3F4</span>
        </div>
      </div>

      <div class="color-box">
        <div class="color"></div>
        <div class="color-info">
          <span class="hex-value">#FEB32A</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
