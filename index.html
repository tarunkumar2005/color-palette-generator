<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Paletter Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Color Palette Generator</h1>
    <button id="generate-btn">
      <i class="fas fa-sync-alt"></i>
      Generate Palette
    </button>

    <div class="palette-container">
      <div class="color-box">
        <div class="color" style="background-color: #e256b4;"></div>
        <div class="color-info">
          <span class="hex-value">#E256B4</span>
          <div class="action-buttons">
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock"></i>
          </div>
        </div>
      </div>

      <div class="color-box">
        <div class="color" style="background-color: #a7b36c;"></div>
        <div class="color-info">
          <span class="hex-value">#A7B36C</span>
          <div class="action-buttons">
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock"></i>
          </div>
        </div>
      </div>

      <div class="color-box">
        <div class="color" style="background-color: #23d2ef;"></div>
        <div class="color-info">
          <span class="hex-value">#23D2EF</span>
          <div class="action-buttons">
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock"></i>
          </div>
        </div>
      </div>

      <div class="color-box">
        <div class="color" style="background-color: #89a3f4;"></div>
        <div class="color-info">
          <span class="hex-value">#89A3F4</span>
          <div class="action-buttons">
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock"></i>
          </div>
        </div>
      </div>

      <div class="color-box">
        <div class="color" style="background-color: #feb32a;"></div>
        <div class="color-info">
          <span class="hex-value">#FEB32A</span>
          <div class="action-buttons">
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
